baseURL = "https://ec-auth.io/"
languageCode = "ja"
title = "EcAuth - EC-CUBE向けパスキー認証サービス"

disableKinds = ["taxonomy", "term"]

[params]
  description = "EC-CUBE管理画面のセキュリティを強化するパスキー認証サービス。5ユーザーまで無料。"
  ogImage = "/images/og-image.png"
  # マイページ／申込フォームが叩く EcAuth 認証 API のベース URL。
  # 本番 = accounts.ec-auth.io / stg = deploy.yml の HUGO_PARAMS_APIBASEURL で上書き。
  # 生 Azure URL はここに書かない。
  apiBaseUrl = "https://accounts.ec-auth.io"
  # マイページが OAuth2(PKCE) public client として使う client_id（accounts の管理コンソール）。
  adminClientId = "ecauth-admin-console"
  # OAuth2 の redirect_uri（登録値と完全一致させる固定文字列。末尾スラッシュ有無に注意）。
  # 認可リクエストとトークン交換の両方でこの値を使い、アドレスバーの実 URL には依存させない。
  # ローカルは deploy/実行時に HUGO_PARAMS_AUTHREDIRECTURI で上書きする。
  authRedirectUri = "https://ec-auth.io/auth/callback"
  # EC-CUBE オーナーズストアのプラグイン配布ページ（4.2/4.3系）。
  # ヘッダー／フッター／トップページから参照するため、URL はここで一元管理する。
  pluginStoreUrl = "https://www.ec-cube.net/products/detail.php?product_id=3557"
  # 利用規約・プライバシーポリシー。サイト内ページにせず GitHub 上の Markdown を直接見せる。
  # 掲載口を一つに絞って管理コストを下げ、改定時に利用者が差分（コミット履歴）を追えるようにするため。
  # docs/ は Hugo のビルド対象外なので、この URL からしか到達しない。
  termsUrl = "https://github.com/EcAuth/ecauth-website/blob/main/docs/terms-of-service.md"
  privacyUrl = "https://github.com/EcAuth/ecauth-website/blob/main/docs/privacy-policy.md"
  # お問い合わせ Google フォームの URL。空のままだとフローティングボタン／フッターリンクは
  # 描画されない（フォーム未作成でもサイトが壊れないようにするため）。
  # 作成手順と Slack 通知の設定は docs/contact-form-setup.md を参照。
  contactFormUrl = "https://forms.gle/2eP4NXbPLPfMzMtw6"
  # 申込時に同意記録として送る規約の版数（POST /api/signup/request の terms_version /
  # privacy_version / cookie_version）。Cookie に関する事項はプライバシーポリシー内の
  # 独立した文書ではなく一節なので、3 つとも同じ版数を送る。
  # 規約を改定したら docs/*.md の版数表・改定履歴とこの値を必ず揃えること。
  policyVersion = "1.0"

[markup.goldmark.renderer]
  unsafe = true

enableRobotsTXT = true

[sitemap]
  changeFreq = "weekly"
  priority = 0.5
