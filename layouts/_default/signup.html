{{ define "main" }}
<div class="app-main">
  <div class="app-card">
    <h1 class="app-title">EcAuth に申し込む</h1>
    <p class="app-lead">メールアドレスを登録すると、確認メールをお送りします。メール内のリンクからパスキーを登録してご利用開始いただけます。</p>

    <form id="signup-form" novalidate>
      <div class="field" id="f-email">
        <label for="email">メールアドレス<span class="req">*</span></label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" aria-describedby="email-hint email-err" required>
        <div class="hint" id="email-hint">確認メールの送信先になります。ログイン ID としても使用します。</div>
        <div class="err-msg" id="email-err" role="alert">有効なメールアドレスを入力してください。</div>
      </div>

      <div class="field" id="f-org">
        <label for="org">組織名（会社名） <span class="opt">（任意）</span></label>
        <input type="text" id="org" name="org" placeholder="サンプル株式会社" autocomplete="organization" aria-describedby="org-hint">
        <div class="hint" id="org-hint">請求書の宛名や管理画面の表示名に使用します。後から設定することもできます。</div>
      </div>

      <div class="field" id="f-contact">
        <label for="contact">ご担当者名<span class="req">*</span></label>
        <input type="text" id="contact" name="contact" placeholder="山田 太郎" autocomplete="name" aria-describedby="contact-hint contact-err" required>
        <div class="hint" id="contact-hint">サポート対応時の宛名に使用します。</div>
        <div class="err-msg" id="contact-err" role="alert">ご担当者名を入力してください。</div>
      </div>

      <button type="submit" class="btn primary block" id="submit-btn">申し込む</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>
  </div>
</div>
{{ end }}

{{ define "scripts" }}
<script src="/js/app.js"></script>
<script src="/js/signup.js"></script>
{{ end }}
