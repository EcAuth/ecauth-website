{{ define "main" }}
<div class="app-main">
  <div class="app-card">
    <h1 class="app-title">ログインできない方へ</h1>
    <p class="app-lead">通常は<strong>パスキー</strong>でログインします。端末を変更した等でパスキーが使えない場合は、登録済みのメールアドレスにログイン用リンク（マジックリンク）をお送りします。</p>

    <form id="magic-request-form" novalidate>
      <div class="field" id="f-email">
        <label for="email">登録済みのメールアドレス<span class="req">*</span></label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" aria-describedby="email-err" required>
        <div class="err-msg" id="email-err" role="alert">有効なメールアドレスを入力してください。</div>
      </div>
      <button type="submit" class="btn primary block" id="submit-btn">ログイン用リンクを送る</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>

    <p class="center mt-2">
      <a class="muted-link" id="passkey-login-link" href="#">← パスキーでログインする</a>
    </p>
  </div>
</div>
{{ end }}

{{ define "scripts" }}
<script src="/js/app.js"></script>
<script src="/js/signin.js"></script>
{{ end }}
